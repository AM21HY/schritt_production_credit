<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Credit｜しゅりプロ</title>

  <meta
    name="description"
    content="しゅりプロが利用しているBGM・SE・画像・動画素材などのクレジット情報一覧です。"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >
</head>

<body>

  <div class="page">

    <!-- ヘッダー -->
    <header class="site-header">

      <!-- ロゴ -->
      <a
        href="./index.html"
        class="logo-link"
        aria-label="HOMEへ戻る"
      >
        <img
          src="./images/shuripro_logo.png"
          alt="しゅりプロ"
          class="site-logo"
        >
      </a>

      <!-- ナビゲーション -->
      <nav
        class="global-nav"
        aria-label="メインメニュー"
      >

        <a
          href="./index.html"
          class="nav-link"
        >
          HOME
        </a>

        <span class="nav-separator">
          ｜
        </span>

        <a
          href="./credit.html"
          class="nav-link active"
          aria-current="page"
        >
          Credit
        </a>

        <span class="nav-separator">
          ｜
        </span>

        <a
          href="./permissions.html"
          class="nav-link"
        >
          Streaming Permissions
        </a>

      </nav>

    </header>

    <!-- メイン -->
    <main class="main-content fade-in">

      <h1 class="page-title">
        Credit
      </h1>

      <p class="page-subtitle">
        使用させていただいている素材・音源・画像・動画等のクレジット一覧です。
      </p>

      <section class="content-section">

        <div class="credit-list">

          <!-- BGM -->
          <article class="credit-item">

            <h3>BGM</h3>

            <p class="item-description">
              配信・動画で使用
            </p>

            <a
              href="https://example.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              https://example.com/
            </a>

          </article>

          <!-- SE -->
          <article class="credit-item">

            <h3>SE</h3>

            <p class="item-description">
              効果音素材
            </p>

            <a
              href="https://example.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              https://example.com/
            </a>

          </article>

          <!-- 画像素材 -->
          <article class="credit-item">

            <h3>画像素材</h3>

            <p class="item-description">
              サムネイル・配信用素材
            </p>

            <a
              href="https://example.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              https://example.com/
            </a>

          </article>

          <!-- 動画素材 -->
          <article class="credit-item">

            <h3>動画素材</h3>

            <p class="item-description">
              オープニング・配信演出素材
            </p>

            <a
              href="https://example.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              https://example.com/
            </a>

          </article>

        </div>

      </section>

    </main>

  </div>

</html>
